<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Hippo!</title>
  <style>
    body {
      background: linear-gradient(to top right, #ffdde1, #ee9ca7);
      font-family: 'Comic Sans MS', cursive, sans-serif;
      text-align: center;
      padding: 50px;
      color: #4b2c20;
      overflow: hidden;
    }
    h1 {
      font-size: 4rem;
      margin-bottom: 20px;
      animation: bounce 1s infinite alternate;
    }
    .hippo {
      font-size: 8rem;
      animation: wiggle 1.5s infinite;
    }
    p {
      font-size: 1.5rem;
      margin-top: 20px;
      animation: fadeIn 2s ease-in-out;
    }
    .balloons {
      font-size: 3rem;
      margin-top: 30px;
      animation: float 2s infinite alternate;
    }
    #countdown {
      font-size: 2rem;
      margin-top: 30px;
      color: #2e1d10;
      animation: fadeIn 2s ease-in-out;
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
    @keyframes float {
      0% { transform: translateY(0); }
      100% { transform: translateY(-10px); }
    }
    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-20px); }
    }
    @keyframes wiggle {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(5deg); }
      50% { transform: rotate(-5deg); }
      75% { transform: rotate(5deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <audio autoplay loop>
    <source src="https://www.bensound.com/bensound-music/bensound-buddy.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>
  <canvas id="fireworks"></canvas>
  <div class="hippo">🦛</div>
  <h1>Happy Birthday, Hippo!</h1>
  <p>Wishing you a day filled with love, laughter, and unforgettable moments. May this year bring you endless happiness and all your heart's desires! 🎉</p>
  <div id="countdown"></div>
  <div class="balloons">🎈🎂🎉🎈</div>

  <script>
    // Countdown Timer
    const countdown = document.getElementById("countdown");
    const birthday = new Date("2025-05-26T00:00:00").getTime();

    setInterval(() => {
      const now = new Date().getTime();
      const distance = birthday - now;

      if (distance <= 0) {
        countdown.innerHTML = "🎉 It's her Birthday Today! 🎉";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      countdown.innerHTML = `⏳ ${days}d ${hours}h ${minutes}m ${seconds}s until her birthday!`;
    }, 1000);

    // Fireworks Effect
    const canvas = document.getElementById("fireworks");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    class Firework {
      constructor() {
        this.x = random(0, canvas.width);
        this.y = canvas.height;
        this.radius = random(2, 4);
        this.color = `hsl(${random(0, 360)}, 100%, 50%)`;
        this.speed = random(3, 7);
        this.angle = -Math.PI / 2;
        this.exploded = false;
        this.particles = [];
      }

      update() {
        if (!this.exploded) {
          this.y += this.speed * Math.sin(this.angle);
          this.speed -= 0.1;
          if (this.speed <= 0) {
            this.exploded = true;
            for (let i = 0; i < 30; i++) {
              this.particles.push(new Particle(this.x, this.y, this.color));
            }
          }
        }
        this.particles.forEach(p => p.update());
      }

      draw() {
        if (!this.exploded) {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.fill();
        }
        this.particles.forEach(p => p.draw());
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.radius = 2;
        this.color = color;
        this.speed = random(1, 6);
        this.angle = random(0, Math.PI * 2);
        this.alpha = 1;
      }

      update() {
        this.x += this.speed * Math.cos(this.angle);
        this.y += this.speed * Math.sin(this.angle);
        this.alpha -= 0.02;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
      }
    }

    const fireworks = [];
    function animate() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (Math.random() < 0.05) {
        fireworks.push(new Firework());
      }

      fireworks.forEach((fw, index) => {
        fw.update();
        fw.draw();
        if (fw.exploded && fw.particles.every(p => p.alpha <= 0)) {
          fireworks.splice(index, 1);
        }
      });
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
